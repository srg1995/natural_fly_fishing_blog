name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same PR/branch cancels the run that is still going
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Tipos y lint
    runs-on: ubuntu-latest
    # Placeholders: SvelteKit validates the variables in src/env.ts when Vite starts.
    # Deploys are done by Vercel's Git integration with the real values, never from here.
    env:
      PUBLIC_SUPABASE_URL: https://example.supabase.co
      PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1
      - run: bun install --frozen-lockfile
      - name: svelte-check
        run: bun run check
      - name: Prettier + ESLint
        run: bun run lint

  test:
    name: Tests
    runs-on: ubuntu-latest
    env:
      PUBLIC_SUPABASE_URL: https://example.supabase.co
      PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1
      - run: bun install --frozen-lockfile
      - name: Instalar Chromium para los tests de componentes
        run: bunx playwright install --with-deps chromium
      - name: Vitest (servidor + navegador)
        run: bun run test

  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      PUBLIC_SUPABASE_URL: https://example.supabase.co
      PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1
      - run: bun install --frozen-lockfile
      - run: bun run build
